name: a3_petshop

services:
  db:
    image: postgres:16
    container_name: petshop_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "55433:5432"
    volumes:
      - petshop_data:/var/lib/postgresql/data

volumes:
  petshop_data:
